[build]
  publish = "public"
  functions = "netlify/functions"

# Scheduled Function: recuperação de carrinho abandonado (roda a cada hora)
[functions."cron-abandoned-cart"]
  schedule = "0 * * * *"

# Rota amigável: /doc/slug -> doc.html
[[redirects]]
  from = "/doc/*"
  to = "/doc.html"
  status = 200

# Página de sucesso do checkout (vamos usar na Fase 3)
[[redirects]]
  from = "/checkout/sucesso"
  to = "/success.html"
  status = 200

  [[redirects]]
from = "/checkout/pending"
to = "/pending.html"
status = 200
[[redirects]]
from = "/checkout/falha"
to = "/failure.html"
status = 200

# Cannibalization merges — 301 redirect duplicate pages to canonical versions
# ATENCAO: sem "force = true" o Netlify NAO aplica o 301 quando o arquivo .html existe.
[[redirects]]
  from = "/guia-completo-autorizacao-viagem.html"
  to = "/guia-definitivo-viagem-menor.html"
  status = 301
  force = true

[[redirects]]
  from = "/viagem-internacional.html"
  to = "/guia-viagem-internacional-menor.html"
  status = 301
  force = true

[[redirects]]
  from = "/regras-idade-viagem.html"
  to = "/guia-idade-viagem-menor.html"
  status = 301
  force = true

# Direcao CORRIGIDA: /modelo-word-pdf-autorizacao-viagem.html e a pagina de melhor CTR
# do site (7,97%, 1.117 impressoes) e nao pode ser redirecionada. A versao "para imprimir"
# (0 impressoes) e que deve ceder o lugar.
[[redirects]]
  from = "/modelo-autorizacao-viagem-para-imprimir.html"
  to = "/modelo-word-pdf-autorizacao-viagem.html"
  status = 301
  force = true

# Netlify serve /viagem.html tanto em /viagem quanto /viagem.html (clean URL) — força canonical
[[redirects]]
  from = "/viagem"
  to = "/viagem.html"
  status = 301
  force = true

